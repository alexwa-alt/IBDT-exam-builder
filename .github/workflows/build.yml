# Builds the encrypted DT paper-builder site from the staff-only Google Drive folder and publishes it to
# GitHub Pages. The question content is downloaded, built and encrypted inside the run; it is never committed.
name: Build and publish

on:
  workflow_dispatch:          # the "Run workflow" button in the Actions tab
  schedule:
    - cron: '17 19 * * *'     # every night at 02:17 Bangkok time (19:17 UTC)

permissions:
  contents: read
  pages: write                # to publish to GitHub Pages
  id-token: write             # lets deploy-pages prove the site came from this workflow

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt google-api-python-client google-auth

      - name: Download the question source from Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/fetch_drive.py --out source

      - name: Read the strands workbook
        run: python scripts/syllabus_import.py source/syllabus/DT_IB_Strands.xlsx

      - name: Build the question bank
        # Questions with errors are left out; the rest are still published. Problems go in the run summary.
        run: |
          python scripts/build_bank.py --source source || echo "Some questions had errors; see the summary."
          python scripts/build_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt the site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GEN_DISPATCH_TOKEN: ${{ secrets.GEN_DISPATCH_TOKEN }}   # optional: turns on the site's Generate/Review buttons
        run: python scripts/encrypt_site.py --out public

      - name: Check nothing readable is published
        run: |
          bad=$(find public -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.yaml' -o -name '*.pdf' \
                -o -name '*.xlsx' -o \( -name '*.json' ! -path 'public/data/lock.json' \) \))
          if [ -n "$bad" ]; then echo "::error::Unencrypted files in the site: $bad"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload the review pack to Drive
        # Needs edit access to the Drive review/ folder; if that isn't granted, the site still publishes.
        continue-on-error: true
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if python scripts/fetch_drive.py --upload-review build/review_pack.pdf; then
            echo "Review pack updated in Drive (review/DT_bank_review_pack.pdf)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**The review pack could not be uploaded to Drive.** See the log of this step." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
