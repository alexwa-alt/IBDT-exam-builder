# Settings for the Gemini question generator (scripts/generator/generate.py).
# Nothing here is secret: the Gemini key and the Drive robot key are GitHub secrets.

# The Gemini model. Change this one value to switch model (see https://ai.google.dev/gemini-api/docs/models).
model: gemini-3.1-pro-preview
# Used with the backup key (GEMINI_API_KEY2), a free-tier key: free keys can't use the Pro preview model.
# "gemini-flash-latest" always points at Google's current Flash model.
backup_model: gemini-flash-latest
# If Google says a model is busy ("503 high demand") twice in a row, switch to this model for the rest of the run.
# Blank = keep retrying the same model. Older models are often less busy.
busy_fallback_model:                       # for the main key (blank: stay on the Pro model)
backup_busy_fallback_model: gemini-2.5-flash
temperature: 0.7
# Price per million tokens in US dollars, only used to estimate each run's cost in its summary.
# Check https://ai.google.dev/gemini-api/docs/pricing when changing the model. Thinking counts as output.
price_per_million: {input: 2.0, output: 12.0}
backup_price_per_million: {input: 0, output: 0}   # the backup key is free
max_output_tokens: 16000

# Limits, so a runaway run (or a button pressed many times) cannot use up the Gemini quota.
max_per_run: 5            # questions per run
max_per_day: 8            # AI questions added to the bank per day (counted from source.generated_on)
max_calls_per_question: 6 # writer + repairs + reviewer + revision
repair_attempts: 2        # times Gemini may fix checker errors before the draft is thrown away

# Case studies: how many questions may share one past-paper case study. The catalogue holds a limited number
# of case studies, so a second question is allowed on each (with different statements and a new angle).
max_questions_per_case_study: 2

# Mix the generator aims for across the whole bank (it writes whatever is furthest below target).
target_share:
  marks: {6: 0.6, 10: 0.4}            # papers are 5 x 6-mark + 2 x 10-mark; the bank needs extra 10-mark
  difficulty: {1: 0.2, 2: 0.45, 3: 0.35}
  early_year_12: 0.3                  # share of questions using only "Yr 12 1.1" statements

# Reference files in Drive (read by the robot account at run time; never copied into this repository).
drive:
  # Copies kept in the bank's reference/ folder, which the robot account can read (the originals are in the
  # department shared drive, which it cannot see).
  past_papers_pdf: 1mwQaJjwJEtf1KC4ZnA3nN7cwxcZa6kTG      # reference/past_papers_case_studies.pdf
  specimen_sl_paper2:                                     # specimen SL Paper 2 and its markscheme (Parts 10-12)
    - 1YjJFOnQjuxwKwQTRbPj06x3dfJXrn4w2                   # reference/specimen_sl_p2_part10.pdf
    - 1Iwrhoc6dGDXBY_naCha4Z7lG2fi6Z4LZ                   # reference/specimen_sl_p2_part11.pdf
    - 1d0icdz8sS986u5BgNm06TtERov42zsDo                   # reference/specimen_sl_p2_part12_markscheme.pdf
  exemplars: [bmw-ix5-hydrogen, daav-airport-wheelchair]  # bank questions shown to Gemini as examples
  reference_folder: reference          # in the bank root: holds case_studies.json
  log_folder: generation-log           # in the bank root: one private log file per run
